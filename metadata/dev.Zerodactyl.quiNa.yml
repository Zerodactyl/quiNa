AutoName: quiNa
Summary: Third-party Telegram client based on Nagram
Description: |-
  quiNa is a third-party Telegram client based on Nagram / NekoX with additional features
  and Material 3 Expressive polish.

  Features include restored official Telegram icons, message-filter URL matching,
  quick-read reactions, bottom-bar shortcuts, tracking-parameter stripping,
  full sensor round videos, M3 Expressive wavy progress/dialogs, combined messages,
  editable text styles, proxy subscription support (VMess/Shadowsocks/SSR/Trojan),
  OpenCC translation, and many NekoX enhancements. See README for full list.

  Anti-Feature: Non-Free Network (Telegram servers are proprietary).

